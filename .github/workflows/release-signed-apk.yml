name: Release Signed APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v1.0.0 or release-1, leave empty to use 'release-1')"
        required: false
        default: "release-1"
        type: string
      release_name:
        description: "Release Title (leave empty to use 'Twi From 67 <tag>')"
        required: false
        default: ""
        type: string
      custom_description:
        description: "Additional Release Notes (Markdown supported)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as Pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Save as Draft Release"
        required: false
        default: false
        type: boolean
      save_keystore:
        description: "Upload Keystore as Workflow Artifact (for backup)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
          CUSTOM_DESCRIPTION: ${{ inputs.custom_description }}
        run: |
          mkdir -p release_meta
          echo "$CUSTOM_DESCRIPTION" > release_meta/custom_description.md

          if [ -n "${INPUT_TAG}" ]; then
            TAG_NAME="${INPUT_TAG}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="release-1"
          fi

          if [ -n "${INPUT_RELEASE_NAME}" ]; then
            RELEASE_NAME="${INPUT_RELEASE_NAME}"
          else
            RELEASE_NAME="Twi From 67 ${TAG_NAME}"
          fi

          if [ "${INPUT_PRERELEASE}" = "true" ] || [[ "${TAG_NAME}" == *"alpha"* ]] || [[ "${TAG_NAME}" == *"beta"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          if [ "${INPUT_DRAFT}" = "true" ]; then
            IS_DRAFT="true"
          else
            IS_DRAFT="false"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${IS_DRAFT}" >> "$GITHUB_OUTPUT"

          echo "=== Release Metadata ==="
          echo "Tag Name: ${TAG_NAME}"
          echo "Release Name: ${RELEASE_NAME}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "=== Pre-installed Platforms ==="
          ls -la "${ANDROID_HOME}/platforms"

      - name: Restore Signing Keystore Cache
        id: cache-signing-keystore
        uses: actions/cache@v4
        with:
          path: .signing_cache
          key: twi-from-67-signing-keystore-v1

      - name: Setup Signing Keystore
        id: keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SECRET_ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          SECRET_ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "=== Setting up Signing Keystore ==="
          mkdir -p .signing_cache keystore_backup

          DEFAULT_KEYSTORE_PASS="twi_from_67_release_2026"
          DEFAULT_ALIAS_NAME="twi_from_67"
          DEFAULT_ALIAS_PASS="twi_from_67_release_2026"

          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Priority 1: Restoring keystore from GitHub Secrets..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > release.keystore
            KEYSTORE_PASS="${SECRET_KEYSTORE_PASS:-$DEFAULT_KEYSTORE_PASS}"
            ALIAS_NAME="${SECRET_ALIAS_NAME:-$DEFAULT_ALIAS_NAME}"
            ALIAS_PASS="${SECRET_ALIAS_PASS:-$KEYSTORE_PASS}"
          elif [ -f .signing_cache/release.keystore ]; then
            echo "Priority 2: Restoring persistent keystore from Actions Cache..."
            cp .signing_cache/release.keystore release.keystore
            if [ -f .signing_cache/credentials.env ]; then
              source .signing_cache/credentials.env
            else
              KEYSTORE_PASS="$DEFAULT_KEYSTORE_PASS"
              ALIAS_NAME="$DEFAULT_ALIAS_NAME"
              ALIAS_PASS="$DEFAULT_ALIAS_PASS"
            fi
          elif [ -f release.keystore ]; then
            echo "Priority 3: Using pre-existing release.keystore in workspace..."
            KEYSTORE_PASS="${SECRET_KEYSTORE_PASS:-$DEFAULT_KEYSTORE_PASS}"
            ALIAS_NAME="${SECRET_ALIAS_NAME:-$DEFAULT_ALIAS_NAME}"
            ALIAS_PASS="${SECRET_ALIAS_PASS:-$KEYSTORE_PASS}"
          else
            echo "Priority 4: Generating persistent baseline release.keystore..."
            KEYSTORE_PASS="$DEFAULT_KEYSTORE_PASS"
            ALIAS_NAME="$DEFAULT_ALIAS_NAME"
            ALIAS_PASS="$DEFAULT_ALIAS_PASS"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${ALIAS_NAME}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASS}" \
              -keypass "${ALIAS_PASS}" \
              -dname "CN=Twi From 67, OU=Release, O=Akari, L=Tokyo, ST=Tokyo, C=JP"
          fi

          # Synchronize active keystore and credentials to cache
          cp release.keystore .signing_cache/release.keystore
          {
            echo "KEYSTORE_PASS=${KEYSTORE_PASS}"
            echo "ALIAS_NAME=${ALIAS_NAME}"
            echo "ALIAS_PASS=${ALIAS_PASS}"
          } > .signing_cache/credentials.env

          # Populate local.properties and environment variables for Gradle
          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> local.properties
          echo "ALIAS_NAME=${ALIAS_NAME}" >> local.properties
          echo "ALIAS_PASS=${ALIAS_PASS}" >> local.properties

          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> $GITHUB_ENV
          echo "ALIAS_NAME=${ALIAS_NAME}" >> $GITHUB_ENV
          echo "ALIAS_PASS=${ALIAS_PASS}" >> $GITHUB_ENV

          # Prepare keystore backup artifact and base64 export
          cp release.keystore keystore_backup/
          base64 -w 0 release.keystore > keystore_backup/keystore_base64.txt
          {
            echo "Keystore File: release.keystore"
            echo "Alias: ${ALIAS_NAME}"
            echo "Keystore Password: ${KEYSTORE_PASS}"
            echo "Key Password: ${ALIAS_PASS}"
            echo ""
            echo "================================================================================"
            echo "Notice: To permanently fix signatures across all CI runners and clean caches:"
            echo "1. Copy the content of 'keystore_base64.txt' into GitHub Repository Secret 'KEYSTORE_BASE64'."
            echo "2. Add 'KEYSTORE_PASS', 'ALIAS_NAME', and 'ALIAS_PASS' to Secrets if customized."
            echo "================================================================================"
          } > keystore_backup/credentials.txt
          echo "Signing Keystore configuration completed successfully."

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Build Signed APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease

      - name: Verify Signatures & Prepare Release Assets
        run: |
          echo "=== Verifying APK Signatures & Preparing Release Assets ==="
          mkdir -p release_assets
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: ${APKSIGNER}"

          for apk in $(find app/build/outputs/apk/release -name "*.apk" | sort); do
            echo "----------------------------------------"
            echo "Verifying: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" || true
            cp "$apk" release_assets/
          done

          (
            cd release_assets
            sha256sum *.apk > SHA256SUMS.txt
          )

          if [ -s release_meta/custom_description.md ] && grep -q '[^[:space:]]' release_meta/custom_description.md; then
            cp release_meta/custom_description.md release_notes.md
          else
            echo "# Twi From 67 Release" > release_notes.md
            echo "" >> release_notes.md
            echo "Modern LSPosed module for X (Twitter) 12.36+ share source parameter customization." >> release_notes.md
          fi

          echo "=== Prepared Release Assets ==="
          ls -lh release_assets/

      - name: Upload Signed APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twi-From-67-${{ steps.meta.outputs.tag_name }}-APKs
          path: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt

      - name: Upload Keystore Artifact
        if: always() && steps.keystore.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.save_keystore != false)
        uses: actions/upload-artifact@v4
        with:
          name: Twi-From-67-Signing-Keystore
          path: keystore_backup/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          generate_release_notes: false
          draft: ${{ steps.meta.outputs.is_draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}