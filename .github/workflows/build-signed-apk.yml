name: Build Signed APK

on:
  workflow_dispatch:
    inputs:
      save_keystore:
        description: "Upload Keystore as Artifact (for app updates)"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Platform 37
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "=== Configuring Android API 37 Platform ==="
          BASE_PLATFORM=$(find ${ANDROID_HOME}/platforms -maxdepth 1 -name "android-*" | sort -V | tail -n 1)
          echo "Using base platform: ${BASE_PLATFORM}"
          mkdir -p "${ANDROID_HOME}/platforms/android-37"
          cp -r "${BASE_PLATFORM}"/* "${ANDROID_HOME}/platforms/android-37/"
          {
            echo "Pkg.Desc=Android SDK Platform 37"
            echo "Pkg.UserSrc=false"
            echo "Platform.Version=17"
            echo "Pkg.Revision=1"
            echo "AndroidVersion.ApiLevel=37"
            echo "Pkg.Path=platforms;android-37"
          } > "${ANDROID_HOME}/platforms/android-37/source.properties"
          echo "Configured platforms:"
          ls -la "${ANDROID_HOME}/platforms"

      - name: Restore Signing Keystore Cache
        id: cache-signing-keystore
        uses: actions/cache@v4
        with:
          path: .signing_cache
          key: twi-from-67-signing-keystore-v1

      - name: Setup Signing Keystore
        id: keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SECRET_ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          SECRET_ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "=== Setting up Signing Keystore ==="
          mkdir -p .signing_cache keystore_backup

          DEFAULT_KEYSTORE_PASS="twi_from_67_release_2026"
          DEFAULT_ALIAS_NAME="twi_from_67"
          DEFAULT_ALIAS_PASS="twi_from_67_release_2026"

          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Priority 1: Restoring keystore from GitHub Secrets..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > release.keystore
            KEYSTORE_PASS="${SECRET_KEYSTORE_PASS:-$DEFAULT_KEYSTORE_PASS}"
            ALIAS_NAME="${SECRET_ALIAS_NAME:-$DEFAULT_ALIAS_NAME}"
            ALIAS_PASS="${SECRET_ALIAS_PASS:-$KEYSTORE_PASS}"
          elif [ -f .signing_cache/release.keystore ]; then
            echo "Priority 2: Restoring persistent keystore from Actions Cache..."
            cp .signing_cache/release.keystore release.keystore
            if [ -f .signing_cache/credentials.env ]; then
              source .signing_cache/credentials.env
            else
              KEYSTORE_PASS="$DEFAULT_KEYSTORE_PASS"
              ALIAS_NAME="$DEFAULT_ALIAS_NAME"
              ALIAS_PASS="$DEFAULT_ALIAS_PASS"
            fi
          elif [ -f release.keystore ]; then
            echo "Priority 3: Using pre-existing release.keystore in workspace..."
            KEYSTORE_PASS="${SECRET_KEYSTORE_PASS:-$DEFAULT_KEYSTORE_PASS}"
            ALIAS_NAME="${SECRET_ALIAS_NAME:-$DEFAULT_ALIAS_NAME}"
            ALIAS_PASS="${SECRET_ALIAS_PASS:-$KEYSTORE_PASS}"
          else
            echo "Priority 4: Generating persistent baseline release.keystore..."
            KEYSTORE_PASS="$DEFAULT_KEYSTORE_PASS"
            ALIAS_NAME="$DEFAULT_ALIAS_NAME"
            ALIAS_PASS="$DEFAULT_ALIAS_PASS"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${ALIAS_NAME}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASS}" \
              -keypass "${ALIAS_PASS}" \
              -dname "CN=Twi From 67, OU=Release, O=Akari, L=Tokyo, ST=Tokyo, C=JP"
          fi

          # Synchronize active keystore and credentials to cache
          cp release.keystore .signing_cache/release.keystore
          {
            echo "KEYSTORE_PASS=${KEYSTORE_PASS}"
            echo "ALIAS_NAME=${ALIAS_NAME}"
            echo "ALIAS_PASS=${ALIAS_PASS}"
          } > .signing_cache/credentials.env

          # Populate local.properties and environment variables for Gradle
          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> local.properties
          echo "ALIAS_NAME=${ALIAS_NAME}" >> local.properties
          echo "ALIAS_PASS=${ALIAS_PASS}" >> local.properties

          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> $GITHUB_ENV
          echo "ALIAS_NAME=${ALIAS_NAME}" >> $GITHUB_ENV
          echo "ALIAS_PASS=${ALIAS_PASS}" >> $GITHUB_ENV

          # Prepare keystore backup artifact and base64 export
          cp release.keystore keystore_backup/
          base64 -w 0 release.keystore > keystore_backup/keystore_base64.txt
          {
            echo "Keystore File: release.keystore"
            echo "Alias: ${ALIAS_NAME}"
            echo "Keystore Password: ${KEYSTORE_PASS}"
            echo "Key Password: ${ALIAS_PASS}"
            echo ""
            echo "================================================================================"
            echo "Notice: To permanently fix signatures across all CI runners and clean caches:"
            echo "1. Copy the content of 'keystore_base64.txt' into GitHub Repository Secret 'KEYSTORE_BASE64'."
            echo "2. Add 'KEYSTORE_PASS', 'ALIAS_NAME', and 'ALIAS_PASS' to Secrets if customized."
            echo "================================================================================"
          } > keystore_backup/credentials.txt
          echo "Signing Keystore configuration completed successfully."

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Build Signed APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease

      - name: Verify APK Signatures
        run: |
          echo "=== Verifying APK Signatures & Printing Certificate Fingerprints ==="
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: ${APKSIGNER}"
          find app/build/outputs/apk/release -name "*.apk" | while read -r apk; do
            echo "----------------------------------------"
            echo "Checking: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" || true
          done

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Twi-From-67-Signed-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Keystore Artifact
        if: always() && steps.keystore.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.save_keystore != false)
        uses: actions/upload-artifact@v4
        with:
          name: Twi-From-67-Signing-Keystore
          path: keystore_backup/